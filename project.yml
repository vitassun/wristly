name: Wristly
options:
  minimumXcodeGenVersion: 2.44.1
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      GCC_OPTIMIZATION_LEVEL: s
      DEAD_CODE_STRIPPING: YES
targets:
  Wristly:
    type: application
    platform: iOS
    sources:
      - path: CompanionApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wristly.app
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wristly
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - target: WristlyWatch
        embed: true
    scheme:
      gatherCoverageData: false
  WristlyWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes: ["Resources/Info.plist"]
    info:
      path: WatchApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Wristly
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.wristly.app
        WKRunsIndependentlyOfCompanionApp: true
        NSMicrophoneUsageDescription: 将你说的问题发送到私人后端，通过豆包识别为可编辑文字。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wristly.app.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      gatherCoverageData: false
